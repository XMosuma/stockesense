services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 3s
      retries: 20
    ports: ["5433:5432"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://stocksense:stocksense@db:5432/stocksense
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  scheduler:            # daily job: import new CSVs from data/inbox, then re-forecast
    build: ./backend
    command: sh -c "while true; do python -m app.daily; sleep 86400; done"
    environment:
      DATABASE_URL: postgresql://stocksense:stocksense@db:5432/stocksense
      INBOX_DIR: /data/inbox
      PROCESSED_DIR: /data/processed
    volumes: ["./data:/data"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  pgdata:
